name: Windows RDP & Web Desktop Node + socks5 (Watchdog Keep-Alive)

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: "Windows Edition (win10, tiny10, win11, ltsc10, tiny11)"
        required: true
        default: "win10"
      ram_size:
        description: "RAM Allocation"
        required: true
        default: "5G"
      cpu_cores:
        description: "CPU Cores"
        required: true
        default: "2"
      rdp_username:
        description: "RDP Username"
        required: true
        default: "docker"
      rdp_password:
        description: "RDP Password"
        required: true
        default: "password"
      enable_warp:
        description: "Enable Outbound Cloudflare WARP IP (AS13335)"
        type: boolean
        default: false
        required: false

jobs:
  launch-windows-node:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Establish Cloudflare WARP Ghost Tunnel (Runner-wide)
        if: ${{ inputs.enable_warp == true }}
        uses: fscarmen/warp-on-actions@v1.2
        with:
          stack: ipv4

      - name: Enable KVM Hardware Acceleration & Install Tunnels
        run: |
          echo "[+] Checking KVM hardware acceleration..."
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
            echo "✅ /dev/kvm is ACTIVE and accessible!"
          else
            echo "❌ /dev/kvm not found! Ensure runner supports nested virtualization."
            exit 1
          fi

          echo "[+] Configuring Linux Kernel TCP Keep-Alive parameters..."
          sudo sysctl -w net.ipv4.tcp_keepalive_time=15
          sudo sysctl -w net.ipv4.tcp_keepalive_intvl=10
          sudo sysctl -w net.ipv4.tcp_keepalive_probes=5
          echo "✅ Kernel TCP Keep-Alive configured."

          echo "[+] Installing cloudflared..."
          curl -sL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

          echo "[+] Installing bore..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xzf - -C /usr/local/bin bore
          chmod +x /usr/local/bin/bore
          echo "✅ bore installed."

      - name: 🧦 Launch SOCKS5 Proxies (Runner IP + WARP IP)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq microsocks

          # --- 1. Runner IP SOCKS5 (existing) ---
          microsocks -i 0.0.0.0 -p 1080 > socks.log 2>&1 &
          sleep 2
          if ! ss -lntp | grep -q ':1080'; then echo "❌ microsocks failed"; cat socks.log; exit 1; fi

          DOCKER_BRIDGE_IP=$(ip -4 addr show docker0 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -n1)
          if [ -z "$DOCKER_BRIDGE_IP" ]; then DOCKER_BRIDGE_IP=$(ip -4 route get 1.1.1.1 | grep -oP 'src \K[\d.]+' | head -n1); fi
          echo "SOCKS_INTERNAL=$DOCKER_BRIDGE_IP:1080" >> $GITHUB_ENV

          # --- 2. WARP SOCKS5 (new, Cloudflare IP) ---
          docker run -d --name warp-socks --restart=always \
            -p 127.0.0.1:1081:9091 \
            ghcr.io/mon-ius/docker-warp-socks
          # Wait for WARP to be ready
          for i in {1..30}; do
            if curl -x socks5h://127.0.0.1:1081 -fsSL https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q "warp=on"; then
              echo "✅ WARP SOCKS5 ready on 1081"
              break
            fi
            sleep 2
          done
          echo "WARP_SOCKS_INTERNAL=$DOCKER_BRIDGE_IP:1081" >> $GITHUB_ENV

          # --- 3. Bore for Runner SOCKS5 (port 1080) + Watchdog ---
          bore local 1080 --to bore.pub > socks_tunnel.log 2>&1 &
          for i in {1..30}; do
            SOCKS_HOST=$(grep -oE "bore\.pub:[0-9]+" socks_tunnel.log | head -n1 || true)
            [ -n "$SOCKS_HOST" ] && break
            sleep 1
          done
          echo "SOCKS_EXTERNAL=$SOCKS_HOST" >> $GITHUB_ENV

          # Watchdog for Runner SOCKS5 bore
          (
            while true; do
              if ! pgrep -f "bore local 1080" > /dev/null; then
                echo "[Watchdog] Runner SOCKS5 bore died. Restarting..." >> socks_watchdog.log
                bore local 1080 --to bore.pub >> socks_tunnel.log 2>&1 &
                sleep 5
                NEW_HOST=$(grep -oE "bore\.pub:[0-9]+" socks_tunnel.log | tail -n1 || true)
                [ -n "$NEW_HOST" ] && echo "$NEW_HOST" > /tmp/socks_external.txt
              fi
              sleep 5
            done
          ) &

          # --- 4. Bore for WARP SOCKS5 (port 1081) + Watchdog ---
          bore local 1081 --to bore.pub > warp_socks_tunnel.log 2>&1 &
          for i in {1..30}; do
            WARP_SOCKS_HOST=$(grep -oE "bore\.pub:[0-9]+" warp_socks_tunnel.log | head -n1 || true)
            [ -n "$WARP_SOCKS_HOST" ] && break
            sleep 1
          done
          echo "WARP_SOCKS_EXTERNAL=$WARP_SOCKS_HOST" >> $GITHUB_ENV

          # Watchdog for WARP SOCKS5 bore
          (
            while true; do
              if ! pgrep -f "bore local 1081" > /dev/null; then
                echo "[Watchdog] WARP SOCKS5 bore died. Restarting..." >> warp_socks_watchdog.log
                bore local 1081 --to bore.pub >> warp_socks_tunnel.log 2>&1 &
                sleep 5
                NEW_HOST=$(grep -oE "bore\.pub:[0-9]+" warp_socks_tunnel.log | tail -n1 || true)
                [ -n "$NEW_HOST" ] && echo "$NEW_HOST" > /tmp/warp_socks_external.txt
              fi
              sleep 5
            done
          ) &

          echo "✅ Both SOCKS5 proxies + watchdogs started."

      - name: Launch Windows Container & Expose RDP with Watchdog
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          docker run -d \
            --name votify-windows-node \
            --device /dev/kvm \
            --cap-add NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389 \
            -p 8080:8080 \
            -e VERSION="${{ inputs.windows_version }}" \
            -e RAM_SIZE="${{ inputs.ram_size }}" \
            -e CPU_CORES="${{ inputs.cpu_cores }}" \
            -e DISK_SIZE="24G" \
            -e USERNAME="${{ inputs.rdp_username }}" \
            -e PASSWORD="${{ inputs.rdp_password }}" \
            dockurr/windows:latest

          cloudflared tunnel --url http://127.0.0.1:8006 > desktop_tunnel.log 2>&1 &
          DESKTOP_URL=""
          for i in {1..35}; do
            DESKTOP_URL=$(grep -o "https://[a-zA-Z0-9-]*\.trycloudflare\.com" desktop_tunnel.log | head -n1 || true)
            [ -n "$DESKTOP_URL" ] && break
            sleep 1
          done

          bore local 3389 --to bore.pub > rdp_tunnel.log 2>&1 &
          RDP_HOST=""
          for i in {1..35}; do
            RDP_HOST=$(grep -oE "bore\.pub:[0-9]+" rdp_tunnel.log | head -n1 || true)
            [ -n "$RDP_HOST" ] && break
            sleep 1
          done
          RDP_PORT=$(echo "$RDP_HOST" | cut -d':' -f2)

          # RDP watchdog (original)
          (
            while true; do
              if ! pgrep -x "bore" > /dev/null 2>&1; then
                bore local 3389 --to bore.pub --port "$RDP_PORT" >> rdp_tunnel.log 2>&1 &
                sleep 5
                if ! pgrep -x "bore" > /dev/null 2>&1; then
                  bore local 3389 --to bore.pub >> rdp_tunnel.log 2>&1 &
                  sleep 4
                  NEW_HOST=$(grep -oE "bore\.pub:[0-9]+" rdp_tunnel.log | tail -n1 || true)
                  [ -n "$NEW_HOST" ] && RDP_PORT=$(echo "$NEW_HOST" | cut -d':' -f2)
                fi
              fi
              sleep 3
            done
          ) &

          CURRENT_IP=$(curl -s https://api.ipify.org || echo "Unknown")

          # Read latest external SOCKS endpoints (watchdog may have updated)
          SOCKS_EXT=$(cat /tmp/socks_external.txt 2>/dev/null || echo "$SOCKS_EXTERNAL")
          WARP_SOCKS_EXT=$(cat /tmp/warp_socks_external.txt 2>/dev/null || echo "$WARP_SOCKS_EXTERNAL")

          echo "=================================================="
          echo "🎉 WINDOWS NODE LIVE"
          echo "🖥️  RDP Host: $RDP_HOST"
          echo "🌐 Web: $DESKTOP_URL"
          echo "🧦 SOCKS5 (Runner IP) inside Windows: $SOCKS_INTERNAL"
          echo "🧦 SOCKS5 (Runner IP) external: socks5://$SOCKS_EXT"
          echo "🧦 SOCKS5 (WARP IP) inside Windows: $WARP_SOCKS_INTERNAL"
          echo "🧦 SOCKS5 (WARP IP) external: socks5://$WARP_SOCKS_EXT"
          echo "=================================================="

          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"🚀 Windows Node LIVE\\n\\n🖥️ RDP: \`$RDP_HOST\` | User: \`${{ inputs.rdp_username }}\` | Pass: \`${{ inputs.rdp_password }}\`\\n🌐 Web: $DESKTOP_URL\\n\\n🧦 SOCKS5 Runner IP (Windows): \`$SOCKS_INTERNAL\`\\n🧦 SOCKS5 Runner IP (External): \`socks5://$SOCKS_EXT\`\\n🧦 SOCKS5 WARP IP (Windows): \`$WARP_SOCKS_INTERNAL\`\\n🧦 SOCKS5 WARP IP (External): \`socks5://$WARP_SOCKS_EXT\`\"}" "$DISCORD_WEBHOOK_URL" || true
          fi

          docker logs -f votify-windows-node &
          LOG_PID=$!
          while docker inspect -f '{{.State.Running}}' votify-windows-node 2>/dev/null | grep -q true; do sleep 30; done
          kill "$LOG_PID" 2>/dev/null || true
