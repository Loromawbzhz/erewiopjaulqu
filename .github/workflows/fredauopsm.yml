name: "Termius Interactive SSH Runner"

on:
  workflow_dispatch:
    inputs:
      discord_webhook:
        description: "Discord Webhook URL (optional, to receive instant connect alert)"
        required: false
        type: string
        default: ""

jobs:
  ssh-session:
    name: "Interactive Termius SSH Terminal"
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job limit: 6 hours

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Display Runner System Specs"
        run: |
          echo "=========================================================="
          echo "💻 GitHub Actions Runner VM Ready for Termius Connection"
          echo "   OS: $(lsb_release -d 2>/dev/null | cut -f2 || uname -s)"
          echo "   CPU Cores: $(nproc)"
          echo "   Total RAM: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "   Disk Space: $(df -h / | awk 'NR==2 {print $4}') available"
          echo "=========================================================="

      - name: "Launch Termius SSH Tunnel (tmate)"
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false

      - name: "Generate Termius Connection Guide & Keep-Alive"
        env:
          INPUT_DISCORD: ${{ github.event.inputs.discord_webhook }}
          SECRET_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DISCORD_WEBHOOK="${INPUT_DISCORD:-$SECRET_DISCORD}"

          # Wait for tmate socket and connection strings
          SSH_CMD=""
          WEB_URL=""
          for i in {1..30}; do
            if [ -S /tmp/tmate.sock ]; then
              TMATE_BIN="tmate"
              if [ -x "/tmp/tmate/tmate" ]; then
                TMATE_BIN="/tmp/tmate/tmate"
              fi
              SSH_CMD=$($TMATE_BIN -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
              WEB_URL=$($TMATE_BIN -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || true)
              if [ -n "$SSH_CMD" ]; then break; fi
            fi
            sleep 1
          done

          # Parse SSH Command (format: ssh username@hostname.tmate.io)
          RAW_ADDR=$(echo "$SSH_CMD" | sed -e 's/^ssh //')
          SSH_USER=$(echo "$RAW_ADDR" | cut -d'@' -f1)
          SSH_HOST=$(echo "$RAW_ADDR" | cut -d'@' -f2)
          SSH_PORT="22"

          echo ""
          echo "=========================================================="
          echo "🚀 TERMIUS CONNECTION DETAILS"
          echo "=========================================================="
          echo "   Hostname / IP: $SSH_HOST"
          echo "   Port:          $SSH_PORT"
          echo "   Username:      $SSH_USER"
          echo "   Password:      (Leave Empty)"
          echo "   SSH Command:   $SSH_CMD"
          echo "   Web Shell URL: $WEB_URL"
          echo "=========================================================="
          echo ""

          # Output to GitHub Action Step Summary
          echo "# 🚀 Termius SSH Connection Details" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📱 Enter these exact fields in Termius:" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hostname / IP | \`$SSH_HOST\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Port | \`$SSH_PORT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Username | \`$SSH_USER\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Password | *(Leave empty)* |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SSH Key | *(None)* |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "### 💻 Command Line (Terminal / PowerShell / Mac):" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "$SSH_CMD" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🌐 Instant Web Browser Terminal (No App Needed):" >> "$GITHUB_STEP_SUMMARY"
          echo "👉 [Click to Open Web Terminal]($WEB_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ⏳ Session Lifetime: Up to 6 hours. To disconnect and stop the runner, type touch /tmp/keepalive_stop or cancel the run." >> "$GITHUB_STEP_SUMMARY"

          # Send Discord Notification if Webhook URL is provided
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" -X POST -d "{
              \"content\": \"🚀 GitHub Actions Termius SSH Node Ready!**\\n\\n**Host: \`$SSH_HOST\`\\n**Port:** \`$SSH_PORT\`\\n**User:** \`$SSH_USER\`\\n**Command:** \`$SSH_CMD\`\\n**Web Shell:** $WEB_URL\"
            }" "$DISCORD_WEBHOOK" >/dev/null || true
          fi

          echo "⏳ Runner is now listening. Waiting for your SSH connection..."
          # Keep runner alive for up to 6 hours or until stopped
          while [ -S /tmp/tmate.sock ] && [ ! -f /tmp/keepalive_stop ]; do
            sleep 10
          done
          echo "Session finished."
